services:
  postgres:
    image: postgres:17-alpine
    container_name: alcada-postgres
    environment:
      POSTGRES_DB: alcada
      POSTGRES_USER: alcada
      POSTGRES_PASSWORD: alcada
    ports:
      - "5432:5432"
    volumes:
      - alcada-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alcada -d alcada"]
      interval: 5s
      timeout: 3s
      retries: 10
  wiremock:
    image: wiremock/wiremock:3.9.1
    container_name: alcada-wiremock
    ports:
      - "8089:8080"
    volumes:
      - ./docker/wiremock/mappings:/home/wiremock/mappings

volumes:
  alcada-postgres-data: