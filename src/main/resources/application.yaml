spring:
  application:
    name: alcada
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/alcada}
    username: ${DB_USERNAME:alcada}
    password: ${DB_PASSWORD:alcada}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

alcada:
  bureau:
    base-url: ${BUREAU_BASE_URL:http://localhost:8089}
    connect-timeout: 1s
    read-timeout: 2s
    retry:
      max-attempts: 3
      initial-backoff: 200ms
      multiplier: 2.0
    circuit-breaker:
      failure-rate-threshold: 50
      sliding-window-size: 10
      minimum-number-of-calls: 5
      open-state-duration: 30s
      half-open-permitted-calls: 3
  limits:
    base-url: ${LIMITS_BASE_URL:http://localhost:8089}
    connect-timeout: 1s
    read-timeout: 2s
    retry:
      max-attempts: 3
      initial-backoff: 200ms
      multiplier: 2.0
    circuit-breaker:
      failure-rate-threshold: 50
      sliding-window-size: 10
      minimum-number-of-calls: 5
      open-state-duration: 30s
      half-open-permitted-calls: 3
  jobs:
    enabled: true
  recovery:
    initial-delay: PT30S
    interval: PT30S
    stale-after: PT1M
    lease: PT2M
    batch-size: 20
  outbox:
    initial-delay: PT5S
    interval: PT2S
    batch-size: 50
    max-attempts: 10